# pgpool-II test bed: streaming replication mode with three backends. Trust authentication, test only.
listen_addresses = '*'
port = 9999
socket_dir = '/tmp'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/tmp'
pid_file_name = '/tmp/pgpool.pid'
logdir = '/tmp'
enable_pool_hba = off
backend_clustering_mode = 'streaming_replication'
backend_hostname0 = 'pgp-pg1'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'
backend_hostname1 = 'pgp-pg2'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'ALLOW_TO_FAILOVER'
backend_hostname2 = 'pgp-pg3'
backend_port2 = 5432
backend_weight2 = 1
backend_flag2 = 'ALLOW_TO_FAILOVER'
load_balance_mode = on
num_init_children = 8
max_pool = 2
sr_check_period = 5
sr_check_user = 'site24x7'
sr_check_password = ''
health_check_period = 5
health_check_user = 'site24x7'
health_check_password = ''
pool_passwd = ''
