# Citus test bed: 1 coordinator + 2 workers (each worker is its own primary).
name: tb-citus
x-citus: &citus
  image: citusdata/citus:12.1
  environment: { POSTGRES_PASSWORD: pgpass, POSTGRES_HOST_AUTH_METHOD: trust }
services:
  citus-coordinator: { <<: *citus, hostname: citus-coordinator, ports: ["127.0.0.1:5480:5432"] }
  citus-worker1: { <<: *citus, hostname: citus-worker1, ports: ["127.0.0.1:5481:5432"] }
  citus-worker2: { <<: *citus, hostname: citus-worker2, ports: ["127.0.0.1:5482:5432"] }
