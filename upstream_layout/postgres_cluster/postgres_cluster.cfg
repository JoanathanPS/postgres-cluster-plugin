[global_configurations]
use_agent_python=0
redirect_output=1

[postgres_cluster]
# One address is enough: the plugin finds the other nodes of the cluster itself.
# Format: host:port[:patroni_port]  (use "none" as patroni_port for non-Patroni clusters)
nodes=127.0.0.1:5441:8001
username=site24x7
password=site24x7
db=appdb
patroni_port=8008
cluster_type=auto
# Lab only (Docker / NAT / port-forwarding): Patroni reports addresses such as pg-node2:5432 that this machine
# cannot reach. Translate them: found_host:found_port=reachable_host:port:patroni_port
address_map=pg-node1:5432=127.0.0.1:5441:8001,pg-node2:5432=127.0.0.1:5442:8002,pg-node3:5432=127.0.0.1:5443:8003
