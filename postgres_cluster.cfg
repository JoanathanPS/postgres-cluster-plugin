[global_configurations]
use_agent_python=0
redirect_output=1

[postgres_cluster]
# Seed host: IP address or hostname of any cluster node (Patroni leader/member or PostgreSQL host)
cluster_host="127.0.0.1"

# Target PostgreSQL server port (default 5432)
postgres_port=5432

# Patroni REST API port (default 8008, 0 to disable Patroni REST discovery)
patroni_port=8008

# Monitoring mode: auto | standalone | cluster (default auto)
# - auto: automatically detects whether target is standalone or cluster
# - standalone: monitors independent database without cluster topology or failover checks
# - cluster: enforces cluster topology discovery and health evaluation
monitor_mode="auto"

# Monitoring credentials
username="site24x7"
password="site24x7"

# Database to connect to for stats collection (default postgres)
db="postgres"

# Backward compatibility with official postgres plugin (1=emit official metrics & tables, 0=pure cluster)
compat_official=1

# Optional cluster name override
cluster_name="production-pg-cluster"

# Explicit static node list (alternative to dynamic cluster_host discovery):
# nodes="pgnode1=127.0.0.1:5441:8001,pgnode2=127.0.0.1:5442:8002,pgnode3=127.0.0.1:5443:8003"

# Address translation map for containerized / NAT / Kubernetes environments
# Maps internal advertised node host:port to agent-reachable host:port
# address_map="pg-node1:5432=10.0.0.1:5432,pg-node1:8008=10.0.0.1:8008"

# Explicit state directory override (must be durable across reboots for primary clamping & rates)
# Default order: configured state_dir -> plugin directory -> ProgramData/var_lib -> tempdir
# state_dir="/var/lib/site24x7/postgres_cluster"

# TLS / SSL connection configuration
sslmode="prefer"
# sslrootcert="/etc/ssl/certs/pg_ca.crt"
# sslcert="/etc/ssl/certs/pg_client.crt"
# sslkey="/etc/ssl/certs/pg_client.key"
